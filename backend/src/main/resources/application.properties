server.port=8081
server.servlet.context-path=/

spring.application.name=onepoint-form-manager
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/onepoint_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# JWT settings (24 hours)
app.jwt.secret=9a2f4c8b7e1d5a3f6c8b2e4d9a1f3c5b8e0d2a4f6c8b1e3d5a7f9c1b3e5d7a9f
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

logging.level.root=INFO
logging.level.com.onepoint.formmanager=DEBUG
logging.level.org.hibernate.SQL=DEBUG
